{% extends 'base.html' %}

{% block conteudo %}

<h2>Adicione sua obra:</h2>
<br> 

<form action="/obras/adicionar" method = "POST">

    <label>Título:</label>
    <input type="text" name="titulo" required>
    <br><br>

    <label>Autor:</label>
    <input type="text" name="autor" required>
    <br><br>

    <select name="status">
        <option>Em andamento</option>
        <option>Concluído</option>
        <option>Abandonada</option>
        <option>Hiatus</option>
    </select>
    <br><br>

    <button type="submit">Criar obra</button>
    <br><br>

</form>

{% endblock %}
