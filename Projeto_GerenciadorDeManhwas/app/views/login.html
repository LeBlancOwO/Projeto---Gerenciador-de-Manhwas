{% extends 'base.html' %}

{% block conteudo %}

<h2>Login</h2>
<h3>Faça seu login:</h3> 
<br> 

<form action="/login/logar" method = "POST">

    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Senha:</label>
    <input type="password" name="senha" required>
    <br><br>

    <button type="submit">Entrar</button>
    <br><br>

    <a href="{{url_for('cadastro.renderizar_cadastro')}}">Sem login? Cadastre-se aqui</a>

</form>

{% endblock %}
