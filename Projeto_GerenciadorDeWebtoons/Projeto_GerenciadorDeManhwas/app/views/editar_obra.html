{% extends 'base.html' %}

{% block conteudo %}

<h2>Editar Obra</h2>

<form action="{{ url_for('obras.Editar_obra', id_obra=obra['id']) }}" method="POST" enctype="multipart/form-data">
    <label>Título:</label>
    <input type="text" name="titulo" value="{{ titulo }}" required>
    <br><br>

    <label>Sinopse:</label>
    <textarea name="sinopse" rows="6" required>{{ sinopse }}</textarea>
    <br><br>

    <label>Tags (selecione pelo menos uma):</label>
    <div class="tags-grid">
        {% for tag in tags_padrao %}
            <label class="tag-chip">
                <input type="checkbox" name="tags" value="{{ tag }}" {% if tag in tags_selecionadas %}checked{% endif %}>
                <span>{{ tag }}</span>
            </label>
        {% endfor %}
    </div>
    <br>

    <label>Nova Capa (opcional):</label>
    <input type="file" name="capa" accept="image/*">
    <br><br>

    <label>Status:</label>
    <select name="status">
        <option value="Em andamento" {% if status_atual == 'Em andamento' %}selected{% endif %}>Em andamento</option>
        <option value="Concluído" {% if status_atual == 'Concluído' %}selected{% endif %}>Concluído</option>
        <option value="Abandonada" {% if status_atual == 'Abandonada' %}selected{% endif %}>Abandonada</option>
        <option value="Hiatus" {% if status_atual == 'Hiatus' %}selected{% endif %}>Hiatus</option>
    </select>
    <br><br>

    <button type="submit">Salvar Alterações</button>
    <a class="btn" href="{{ url_for('obras.Minhas_obras') }}">Cancelar</a>
</form>

{% endblock %}
