{% extends 'base.html' %}

{% block conteudo %}

<div class="auth-wrapper">
    <div class="obra-card auth-card">
        <div class="auth-header">
            <h2>Crie sua conta</h2>
            <p class="texto-suave">Cadastre-se para publicar obras, comentar e acompanhar seus manhwas favoritos.</p>
        </div>

        <form action="/cadastro/cadastrar" method="POST" enctype="multipart/form-data" class="auth-form">
            <div class="campo-grupo">
                <label>Nome completo</label>
                <input type="text" name="nome" placeholder="Seu nome" required>
            </div>

            <div class="campo-grupo">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo-grupo">
                <label>Username</label>
                <input type="text" name="username" placeholder="Ex: leitor_glb" required>
            </div>

            <div class="campo-grupo">
                <label>Senha (mín. 6 caracteres)</label>
                <input type="password" name="senha" placeholder="Crie uma senha segura" required>
            </div>

            <div class="campo-grupo">
                <label>Foto de perfil (opcional)</label>
                <input type="file" name="foto" accept="image/*">
            </div>

            <button type="submit" class="btn-primario btn-largo">Cadastrar</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('login.renderizar_login') }}" class="auth-link-cadastro">Já possui conta? Faça login aqui</a>
        </div>
    </div>
</div>

{% endblock %}
