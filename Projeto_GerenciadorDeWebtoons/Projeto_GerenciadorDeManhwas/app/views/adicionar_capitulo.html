{% extends 'base.html' %}

{% block conteudo %}

<h2>Adicionar Capítulo — {{ obra["titulo"] }}</h2>

<div class="obra-card">
    <form method="POST" action="{{ url_for('capitulos.adicionar_capitulo', obra_id=obra['id']) }}">
        <label>Título do Capítulo:</label>
        <input type="text" name="titulo" value="{{ titulo or '' }}" placeholder="Ex: Capítulo 1 — O Início" required>
        <br><br>

        <label>Status da Obra:</label>
        <select name="status">
            {% for st in status_validos %}
                <option value="{{ st }}" {% if status_selecionado == st %}selected{% endif %}>{{ st }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label>Conteúdo / Texto do Capítulo:</label>
        <textarea name="conteudo" rows="10" required>{{ conteudo or '' }}</textarea>
        <br><br>

        <button type="submit" class="btn-primario">Publicar Capítulo</button>
        <a class="btn btn-secundario" href="{{ url_for('obras.Minhas_obras') }}">Voltar para Minhas Obras</a>
    </form>
</div>

{% endblock %}
