{% extends 'base.html' %}

{% block conteudo %}

<div class="auth-wrapper">
    <div class="obra-card auth-card">
        <div class="auth-header">
            <h2>Redefinir Senha</h2>
            <p class="texto-suave">Confirme seu e-mail e username cadastrados para definir uma nova senha.</p>
        </div>

        <form method="POST" action="{{ url_for('login.redefinir_senha') }}" class="auth-form">
            <div class="campo-grupo">
                <label>E-mail</label>
                <input type="email" name="email" value="{{ email or '' }}" placeholder="seu@email.com" required>
            </div>

            <div class="campo-grupo">
                <label>Username</label>
                <input type="text" name="username" value="{{ username or '' }}" placeholder="Seu username" required>
            </div>

            <div class="campo-grupo">
                <label>Nova senha (mín. 6 caracteres)</label>
                <input type="password" name="nova_senha" placeholder="Digite a nova senha" required>
            </div>

            <div class="campo-grupo">
                <label>Confirmar nova senha</label>
                <input type="password" name="confirmar_senha" placeholder="Repita a nova senha" required>
            </div>

            <button type="submit" class="btn-primario btn-largo">Redefinir Senha</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('login.renderizar_login') }}">Voltar ao Login</a>
        </div>
    </div>
</div>

{% endblock %}
